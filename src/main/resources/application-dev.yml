quarkus:
  http:
    cors:
      origins: "*"
  flyway:
    enabled: false
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;
    username: sa
    password: sa

  hibernate-orm:
    schema-management:
      strategy: drop-and-create
    log:
      format-sql: true
      active: true

  mailer:
    mock: true
    from: noreply@codelevel.com

  rest-client:
    identity-api:
      url: http://localhost:8080/api
    course-api:
      url: http://localhost:8080/api
    student-progress-api:
      url: http://localhost:8080/api
    linkedin-api:
      url: https://api.linkedin.com
    instagram-api:
      url: https://graph.facebook.com/v19.0

integration:
  mock-publishing: true
